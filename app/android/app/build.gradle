plugins { id 'com.android.application' }
android {
    namespace 'io.github.codexpocket.app'
    compileSdk 37
    defaultConfig {
        applicationId 'io.github.codexpocket.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        pocketDebug {
            storeFile file(providers.gradleProperty("pocketDebugStore").getOrElse(rootProject.file(".local/debug.keystore").absolutePath))
            storePassword "android"
            keyAlias "pocket-development"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.pocketDebug; manifestPlaceholders = [allowCleartext:'true'] }
        release { minifyEnabled false; manifestPlaceholders = [allowCleartext:'false'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../web'] } }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.arch.core:core-runtime:2.2.0'
}
